<head>

    <meta name="twitter:description" content="2025年母親節特別活動，紅配鑽真美麗！獻給所有偉大的母親。">
    <meta name="twitter:image" content="https://github.com/Randytsay/heartdiamond/blob/main/images/preview.png"> <!-- 替換為您的實際圖片URL -->

    <!-- 網站圖標 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff5f5; /* 更改為淡粉色背景，更符合母親節主題 */
        }
        
        .password-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff5f5;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
            background-image: url('https://i.imgur.com/example-bg.jpg'); /* 可選：添加背景圖片 */
            background-size: cover;
            background-position: center;
        }
        
        .password-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid #ffccd5; /* 添加淡粉色邊框 */
        }
        
        h2 {
            margin-top: 0;
            color: #e83e8c; /* 更改為粉紅色，符合母親節主題 */
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #e83e8c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(232, 62, 140, 0.2);
        }
        
        button {
            background-color: #e83e8c; /* 更改為粉紅色，符合母親節主題 */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        button:hover {
            background-color: #d6336c;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e83e8c; /* 更改為粉紅色，符合母親節主題 */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 10;
            display: none;
        }
        
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 100;
            display: none;
        }
        
        /* 添加母親節裝飾元素 */
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(232, 62, 140, 0.4);
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 裝飾元素 -->
    <div class="decoration" id="decoration"></div>
    
    <!-- 密碼表單 -->
    <div class="password-container" id="passwordForm">
        <div class="password-form">
            <h2>2025母親節活動</h2>
            <p>❤️紅配鑽💎真美麗🌸</p>
            <input type="password" id="password" placeholder="請輸入活動密碼" autocomplete="off">
            <button onclick="checkPassword()">進入活動頁面</button>
            <p style="font-size: 12px; color: #888; margin-top: 15px;">請輸入邀請函上的密碼</p>
        </div>
    </div>
    
    <!-- 加載指示器 -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
    </div>
    
    <!-- Super.so網站iframe -->
    <iframe 
        id="supersoFrame"
        class="iframe-container" 
        allowfullscreen
        onload="frameLoaded()">
    </iframe>
    
    <script>
        // 創建漂浮的愛心裝飾
        function createHearts() {
            const decoration = document.getElementById('decoration');
            const heartSymbols = ['❤️', '💖', '💕', '💗', '💓', '💝'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 10 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                decoration.appendChild(heart);
            }
        }
        
        // 頁面載入時創建裝飾
        window.addEventListener('load', createHearts);
        
        // 檢查密碼
        function checkPassword() {
            // 設置您的密碼
            const correctPassword = "1234";
            const passwordInput = document.getElementById("password").value;
            
            if (passwordInput === correctPassword) {
                // 顯示加載指示器
                document.getElementById("loader").style.display = "flex";
                document.getElementById("passwordForm").style.opacity = "0";
                
                setTimeout(function() {
                    document.getElementById("passwordForm").style.display = "none";
                    
                    // 設置iframe源並顯示
                    document.getElementById("supersoFrame").src = "https://heartdiamond.super.site/";
                    document.getElementById("supersoFrame").style.display = "block";
                }, 500);
            } else {
                alert("密碼錯誤，請重試！");
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }
        
        // iframe加載完成後隱藏加載指示器
        function frameLoaded() {
            setTimeout(function() {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loader').style.display = 'none';
                }, 500);
            }, 1000);
        }
        
        // 按Enter鍵提交密碼
        document.getElementById("password").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
